services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: regression
      POSTGRES_USER: regression
      POSTGRES_PASSWORD: local_regression_only
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U regression -d regression]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: ../backend/main
    command: [alembic, upgrade, head]
    environment:
      ENVIRONMENT: development
      BILLING_DATABASE_URL: postgresql+asyncpg://regression:local_regression_only@database:5432/regression
    depends_on:
      database:
        condition: service_healthy
  backend:
    build: ../backend/main
    command: [uvicorn, regression_observed_main:app, --host, "0.0.0.0", --port, "8000"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:18765:8000"
    environment: &backend_environment
      ENVIRONMENT: development
      MODEL_SERVICE_TYPE: mock
      FIREBASE_CREDENTIALS_PATH: /run/firebase.json
      BILLING_DATABASE_URL: postgresql+asyncpg://regression:local_regression_only@database:5432/regression
      REPORT_GENERATION_ENCRYPTION_KEY: ${REGRESSION_ENCRYPTION_KEY:?Generated by regression.py}
      IS_ROBOKASSA_LIVE_ENABLED: "false"
      ROBOKASSA_MERCHANT_LOGIN: ${REGRESSION_ROBOKASSA_MERCHANT_LOGIN:-}
      ROBOKASSA_PASSWORD1: ${REGRESSION_ROBOKASSA_PASSWORD1:-}
      ROBOKASSA_PASSWORD2: ${REGRESSION_ROBOKASSA_PASSWORD2:-}
      EMAIL_SENDER: regression@example.invalid
      EMAIL_PASSWORD: regression
      EMAIL_SMTP_HOST: mail
      EMAIL_SMTP_PORT: "1025"
      SSL_CERT_FILE: /run/regression-smtp-ca.pem
    volumes:
      - type: bind
        source: ./backend/observed_main.py
        target: /app/regression_observed_main.py
        read_only: true
      - type: bind
        source: ${REGRESSION_BACKEND_EVIDENCE_DIR:-./cache/backend-evidence}
        target: /regression-evidence
      - type: bind
        source: ${REGRESSION_FIREBASE_CREDENTIALS:?Set in test/secrets/config.local.json}
        target: /run/firebase.json
        read_only: true
      - type: bind
        source: ${REGRESSION_SMTP_TLS_DIR:-./secrets/smtp}/ca-bundle.pem
        target: /run/regression-smtp-ca.pem
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      mail:
        condition: service_started
  report_worker:
    build: ../backend/main
    command: [python, /app/regression_worker.py]
    restart: unless-stopped
    environment: *backend_environment
    volumes:
      - type: bind
        source: ./backend/controlled_worker.py
        target: /app/regression_worker.py
        read_only: true
      - type: bind
        source: ./backend/model_control.py
        target: /app/regression_model_control.py
        read_only: true
      - type: bind
        source: ${REGRESSION_BACKEND_EVIDENCE_DIR:-./cache/backend-evidence}
        target: /regression-evidence
      - type: bind
        source: ${REGRESSION_FIREBASE_CREDENTIALS:?Set in test/secrets/config.local.json}
        target: /run/firebase.json
        read_only: true
      - type: bind
        source: ${REGRESSION_SMTP_TLS_DIR:-./secrets/smtp}/ca-bundle.pem
        target: /run/regression-smtp-ca.pem
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
  mail:
    build: ./smtp
    volumes:
      - mail:/data
      - type: bind
        source: ${REGRESSION_SMTP_TLS_DIR:-./secrets/smtp}
        target: /tls
        read_only: true
volumes:
  database:
  mail:
