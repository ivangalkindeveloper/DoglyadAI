appId: ${APP_ID}
name: e2e-templatelist-load-failure
tags:
- e2e
- TemplateList
---
- runFlow:
    file: ../../../maestro/support/menu-with-fault.yaml
    env:
      REPOSITORY_FAULT: templateRepository.getTemplates
- tapOn:
    text: ^Шаблоны протоколов$
- assertVisible: Произошла неизвестная ошибка.*
- assertNotVisible: Тут пока нет шаблонов.*
- assertVisible: {id: message.error}
- takeScreenshot: TemplateList-load-failed
- tapOn:
    text: ^Обновить$
- assertVisible: Retry template
- extendedWaitUntil:
    notVisible: {id: message.error}
    timeout: 15000
- assertNotVisible: Произошла неизвестная ошибка.*
- takeScreenshot: TemplateList-load-retried
