appId: ${APP_ID}
name: e2e-settingsai-parameters-0_7-1024
tags:
- e2e
- SettingsAI
---
- runFlow: ../../../maestro/support/menu.yaml
- scrollUntilVisible:
    element:
      text: ^Настройки\ AI$
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ^Настройки\ AI$
- scrollUntilVisible:
    element:
      id: settingsAI.temperature
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: settingsAI.temperature
    index: 1
- eraseText
- inputText: '0.7'
- runFlow: ../../../maestro/support/hide-keyboard.yaml
- scrollUntilVisible:
    element:
      id: settingsAI.maxTokens
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: settingsAI.maxTokens
    index: 1
- eraseText
- inputText: '1024'
- runFlow: ../../../maestro/support/hide-keyboard.yaml
- tapOn:
    text: ^Сохранить$
- assertVisible:
    text: ^Настройки\ сохранены$
- runFlow: ../../../maestro/support/menu.yaml
- scrollUntilVisible:
    element:
      text: ^Настройки\ AI$
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ^Настройки\ AI$
- scrollUntilVisible:
    element:
      id: settingsAI.temperature
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertVisible:
    id: settingsAI.temperature
    text: 0[.,]7
- scrollUntilVisible:
    element:
      id: settingsAI.maxTokens
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertVisible:
    id: settingsAI.maxTokens
    text: '1024'
- takeScreenshot: SettingsAI-parameters-0_7-1024
