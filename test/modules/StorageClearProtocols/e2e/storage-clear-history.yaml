appId: ${APP_ID}
name: e2e-storageclearprotocols-storage-clear-history
tags:
- e2e
- StorageClearProtocols
---
- runFlow: ../../../maestro/support/main.yaml
- scrollUntilVisible:
    element:
      id: scan.patientName
    direction: DOWN
    centerElement: true
- tapOn:
    id: scan.patientName
    index: 1
- eraseText: 100
- inputText: Storage preserved draft
- runFlow: ../../../maestro/support/hide-keyboard.yaml
- runFlow: ../../../maestro/support/settings.yaml
- scrollUntilVisible:
    element:
      text: ^Хранилище$
    direction: DOWN
    timeout: 15000
- tapOn:
    text: ^Хранилище$
- tapOn:
    text: ^Удалить\ историю\ протоколов$
- assertVisible:
    text: ^Очистить\ историю\ протоколов$
- takeScreenshot: 090-StorageClearProtocols-confirm
- tapOn:
    text: ^Очистить$
- runFlow: ../../../maestro/support/settings.yaml
- tapOn:
    text: ^История\ исследований$
- assertVisible: '(?s)^Список последних протоколов пуст\..*'
- takeScreenshot: 091-History-after-clear
- runFlow: ../../../maestro/support/settings.yaml
- tapOn: ^Шаблоны протоколов$
- assertVisible: ^Retry template$
- assertVisible: ^УЗИ Щитовидной железы$
- runFlow: ../../../maestro/support/settings.yaml
- tapOn: ^Рабочие настройки$
- assertVisible: regression@example.invalid
- runFlow: ../../../maestro/support/main.yaml
- scrollUntilVisible:
    element:
      id: scan.patientName
    direction: DOWN
- assertVisible:
    id: scan.patientName
    text: ^Storage preserved draft$
- takeScreenshot: Scan-draft-preserved-after-history-clear
