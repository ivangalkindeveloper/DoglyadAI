appId: ${APP_ID}
name: e2e-scan-initialization-retry
tags: [e2e, Scan]
---
- runFlow: ../../../maestro/support/one-photo.yaml
- runFlow: ../../../maestro/support/fill-scan.yaml
- scrollUntilVisible:
    element: {id: scan.patientName}
    direction: UP
    centerElement: true
- tapOn: {id: scan.patientName, index: 1}
- eraseText: 100
- inputText: Regression initialization
- runFlow: ../../../maestro/support/hide-keyboard.yaml
- pressKey: Home
- launchApp:
    arguments:
      regressionPreview: ''
      regressionFault: ultrasoundDraftRepository.getDraft
      regressionFaultAfter: '0'
- extendedWaitUntil:
    visible: {id: message.error}
    timeout: 60000
- assertVisible: {id: message.error}
- assertVisible: {id: scan.patientName, enabled: true}
- assertVisible: {id: scan.generate, enabled: true}
- assertVisible: {id: scan.settings, enabled: true}
- assertVisible: {id: scan.type, enabled: true}
- assertVisible: {id: scan.speech, enabled: true}
- takeScreenshot: Scan-initialization-failed
- assertNotVisible: {id: scan.restoreDraft}
- extendedWaitUntil:
    notVisible: {id: message.error}
    timeout: 15000
- tapOn: {id: scan.settings}
- extendedWaitUntil:
    visible: '^Настройки$'
    timeout: 15000
- tapOn: {id: navigation.back}
- extendedWaitUntil:
    visible: {id: scan.patientName}
    timeout: 30000
- assertVisible: {id: 'scan.photo\..*'}
- assertVisible: {id: scan.patientName, text: '^Regression initialization$'}
- takeScreenshot: Scan-initialization-restored-draft
