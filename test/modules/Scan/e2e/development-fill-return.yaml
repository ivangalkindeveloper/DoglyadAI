appId: ${APP_ID}
name: e2e-scan-development-fill-return
tags:
- e2e
- Scan
---
# iOS exposes only the first 512 characters of these multiline fields to Maestro.
- runFlow: ../../../maestro/support/fill-scan.yaml
- scrollUntilVisible:
    element:
      id: scan.patientComplaints
    direction: UP
    timeout: 20000
- assertVisible:
    id: scan.patientComplaints
    text: ^Пациент\ предъявляет\ жалобы\ на\ периодическое\ ощущение\ давления\ и\
      дискомфорта\ в\ передней\ области\ шеи,\ возникающее\ преимущественно\ в\ утренние\
      часы\ и\ при\ физической\ нагрузке\.\ Отмечает\ затруднение\ при\ глотании\
      твёрдой\ пищи,\ появившееся\ около\ трёх\ недель\ назад\.\ Со\ слов\ пациента,\
      в\ последний\ месяц\ наблюдается\ выраженная\ общая\ слабость,\ повышенная\
      утомляемость\ и\ снижение\ работоспособности\ во\ второй\ половине\ дня\.\ Эпизодически\
      фиксирует\ субфебрильную\ температуру\ до\ 37,2\ °C\.\ Потери\ веса\ не\ отмечает\.\
      Ранее\ подобных\ жал.*$
- scrollUntilVisible:
    element:
      id: scan.examinationDescription
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: scan.examinationDescription
    text: ^Проведено\ ультразвуковое\ исследование\ щитовидной\ железы\ линейным\
      датчиком\ в\ стандартных\ продольных\ и\ поперечных\ проекциях\ с\ оценкой\
      обеих\ долей\ и\ перешейка\.\ Правая\ доля:\ 52×18×16\ мм,\ объём\ 7,4\ мл\.\
      Левая\ доля:\ 50×17×15\ мм,\ объём\ 6,3\ мл\.\ Общий\ объём\ железы\ —\ 13,7\
      мл,\ что\ соответствует\ верхней\ границе\ нормы\.\ Контуры\ долей\ ровные,\
      чёткие,\ капсула\ не\ утолщена\.\ Эхогенность\ паренхимы\ средняя,\ структура\
      однородная,\ без\ очаговых\ изменений\.\ Перешеек\ толщиной\ 4\ мм,\ без\ особенностей\.\
      Кровоток\ при\ цветовом\ допплеровском.*$
- tapOn:
    id: scan.settings
- tapOn:
    id: navigation.back
- scrollUntilVisible:
    element:
      id: scan.examinationDescription
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: scan.examinationDescription
    text: ^Проведено\ ультразвуковое\ исследование\ щитовидной\ железы\ линейным\
      датчиком\ в\ стандартных\ продольных\ и\ поперечных\ проекциях\ с\ оценкой\
      обеих\ долей\ и\ перешейка\.\ Правая\ доля:\ 52×18×16\ мм,\ объём\ 7,4\ мл\.\
      Левая\ доля:\ 50×17×15\ мм,\ объём\ 6,3\ мл\.\ Общий\ объём\ железы\ —\ 13,7\
      мл,\ что\ соответствует\ верхней\ границе\ нормы\.\ Контуры\ долей\ ровные,\
      чёткие,\ капсула\ не\ утолщена\.\ Эхогенность\ паренхимы\ средняя,\ структура\
      однородная,\ без\ очаговых\ изменений\.\ Перешеек\ толщиной\ 4\ мм,\ без\ особенностей\.\
      Кровоток\ при\ цветовом\ допплеровском.*$
- takeScreenshot: Scan-development-fill-return
