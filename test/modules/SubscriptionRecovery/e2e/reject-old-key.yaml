appId: ${APP_ID}
name: e2e-subscriptionrecovery-reject-old-key
tags: [e2e, SubscriptionRecovery, yookassa]
---
- launchApp:
    clearState: true
    arguments:
      regressionPreview: ''
      regressionCaptureSplash: 'false'
      regressionNewBillingOwner: 'true'
      regressionFault: ''
- extendedWaitUntil:
    visible: '^Добро пожаловать в Догляд!$'
    timeout: 60000
- tapOn: ^Далее$
- tapOn: ^Далее$
- tapOn: {id: onboarding.acceptLegal}
- tapOn: ^Принять$
- tapOn: ^Выбрать тип$
- scrollUntilVisible:
    element: {id: examinationType.thyroidGland}
    direction: DOWN
    centerElement: true
- tapOn: {id: examinationType.thyroidGland}
- tapOn: ^Давайте начнем!$
- runFlow: ../../../maestro/support/paywall-ready.yaml
- scrollUntilVisible:
    element: {text: '^Восстановить покупки$', above: {id: paywall.continue}}
    direction: DOWN
    centerElement: true
- tapOn: {text: '^Восстановить покупки$', above: {id: paywall.continue}}
- assertVisible: ^Восстановление доступа$
- longPressOn: {id: subscriptionRecovery.input, index: 1}
- tapOn: ^Вставить$
- runFlow:
    when: {visible: '^Разрешить вставку$'}
    commands:
    - tapOn: ^Разрешить вставку$
- runFlow: ../../../maestro/support/hide-keyboard.yaml
- tapOn: ^Восстановить доступ$
- extendedWaitUntil:
    visible: '^Не удалось восстановить доступ. Проверьте ключ и подключение.$'
    timeout: 30000
- assertNotVisible: {id: scan.settings}
- takeScreenshot: SubscriptionRecovery-replaced-key-rejected
