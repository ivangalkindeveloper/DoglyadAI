appId: ${APP_ID}
name: e2e-subscriptionrecovery-create-key
tags: [e2e, SubscriptionRecovery, yookassa]
---
- runFlow: ../../../maestro/support/settings.yaml
- scrollUntilVisible:
    element: {text: '^Управление подпиской$'}
    direction: DOWN
- tapOn: ^Управление подпиской$
- scrollUntilVisible:
    element: {text: '^Ключ восстановления$'}
    direction: DOWN
- tapOn: ^Ключ восстановления$
- tapOn: ^Создать ключ восстановления$
- extendedWaitUntil:
    visible: {id: subscriptionRecovery.generatedKey}
    timeout: 30000
- tapOn: ^Скопировать ключ$
- takeScreenshot: SubscriptionRecovery-original-key
