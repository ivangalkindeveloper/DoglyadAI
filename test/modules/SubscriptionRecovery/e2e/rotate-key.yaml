appId: ${APP_ID}
name: e2e-subscriptionrecovery-rotate-key
tags: [e2e, SubscriptionRecovery, yookassa]
---
- tapOn: ^Создать ключ восстановления$
- extendedWaitUntil:
    visible: {id: subscriptionRecovery.generatedKey}
    timeout: 30000
- tapOn: ^Скопировать ключ$
# Do not publish the new live key. The previous screenshot becomes invalid here.
- tapOn: {id: navigation.back}
- assertVisible: ^Моя подписка$
- takeScreenshot: SubscriptionRecovery-key-rotated
