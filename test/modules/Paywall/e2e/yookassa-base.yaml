appId: ${APP_ID}
name: e2e-paywall-yookassa-base
tags:
- e2e
- Paywall
- yookassa
---
- runFlow: ../../../maestro/support/new-payment-owner.yaml
- tapOn: ^Подписка Base$
- scrollUntilVisible:
    element:
      id: paywall.plan.base_weekly
    direction: DOWN
- tapOn:
    id: paywall.plan.base_weekly
- assertVisible:
    id: paywall.plan.base_weekly
    selected: true
- takeScreenshot: Paywall-yookassa-base-selected
- tapOn:
    id: paywall.continue
- extendedWaitUntil:
    visible: ^Банковская карта$
    timeout: 30000
- assertVisible: ^Base - Недельный доступ$
- assertVisible: ^149[,.]00₽$
- takeScreenshot: Paywall-yookassa-base-sdk
- tapOn: ^Введите$
- inputText: '4111111111111111'
- tapOn: ^ММ/ГГ$
- inputText: '1230'
- tapOn: ^CVC$
- inputText: '123'
- tapOn: ^Продолжить$
- extendedWaitUntil:
    notVisible: '^Банковская карта$'
    timeout: 60000
- extendedWaitUntil:
    notVisible: '^Начните работать уже сегодня!$'
    timeout: 60000
- runFlow: ../../../maestro/support/settings.yaml
- scrollUntilVisible:
    element:
      text: ^Управление подпиской$
    direction: DOWN
    timeout: 15000
- tapOn: ^Управление подпиской$
- assertVisible: ^Моя подписка$
- assertVisible: ^Подписка Base$
- assertVisible: ^Активна$
- assertVisible: ^Base - Недельный доступ$
- takeScreenshot: ManageSubscription-yookassa-base-purchased
