appId: ${APP_ID}
name: e2e-paywall-yookassa-pending
tags:
- e2e
- Paywall
- yookassa
---
- runFlow: ../../../maestro/support/new-payment-owner.yaml
- tapOn: ^Подписка Pro$
- scrollUntilVisible:
    element:
      id: paywall.plan.pro_weekly
    direction: DOWN
- tapOn:
    id: paywall.plan.pro_weekly
- assertVisible:
    id: paywall.plan.pro_weekly
    selected: true
- takeScreenshot: Paywall-yookassa-pending-selected
- tapOn:
    id: paywall.continue
- extendedWaitUntil:
    visible: ^Банковская карта$
    timeout: 30000
- assertVisible: ^Pro - Недельный доступ$
- assertVisible: ^249[,.]00₽$
- takeScreenshot: Paywall-yookassa-pending-sdk
- tapOn: ^Введите$
- inputText: '5555555555554477'
- tapOn: ^ММ/ГГ$
- inputText: '1230'
- tapOn: ^CVC$
- inputText: '123'
- tapOn: ^Продолжить$
- extendedWaitUntil:
    visible: ^Card authentication$
    timeout: 30000
- takeScreenshot: Paywall-yookassa-3ds-challenge
- tapOn:
    point: 9%,13%
- extendedWaitUntil:
    visible: ^Проверить оплату$
    timeout: 30000
- assertNotVisible:
    id: scan.settings
- takeScreenshot: Paywall-yookassa-pending
- tapOn: ^Проверить оплату$
- extendedWaitUntil:
    visible:
      text: ^Проверить оплату$
      enabled: true
    timeout: 30000
- assertNotVisible:
    id: scan.settings
- takeScreenshot: Paywall-yookassa-still-pending
