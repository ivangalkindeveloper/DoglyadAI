appId: ${APP_ID}
name: e2e-paywall-select-pro_monthly
tags:
- e2e
- Paywall
---
- runFlow: ../../../maestro/support/menu.yaml
- scrollUntilVisible:
    element:
      text: ^Управление\ подпиской$
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ^Управление\ подпиской$
- scrollUntilVisible:
    element:
      text: ^Сменить\ план$
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ^Сменить\ план$
- assertVisible: ^Смена\ подписки$
- tapOn:
    text: ^Сменить\ план$
- tapOn:
    text: ^Подписка\ Pro$
- assertVisible: ^Доступ\ к\ продвинутым\ медицинским\ нейронным\ моделям$
- assertVisible: ^Заполнение\ медицинского\ осмотра\ с\ помощью\ голоса$
- assertVisible: ^Отправка\ медицинских\ заключений\ на\ рабочую\ почту$
- scrollUntilVisible:
    element:
      id: paywall.plan.pro_monthly
    direction: DOWN
    timeout: 20000
- tapOn:
    id: paywall.plan.pro_monthly
- assertVisible:
    id: paywall.plan.pro_monthly
    selected: true
- assertVisible:
    id: paywall.continue
    enabled: true
- assertVisible: ^7[\s\u00a0\u202f]*9[\s\u00a0\u202f]*9,00[\s\u00a0\u202f]*₽ / мес\.$
- assertVisible: ^Pro\ \-\ Месячный\ доступ$
- takeScreenshot: Paywall-selected-pro_monthly
