appId: ${APP_ID}
name: e2e-paywall-yookassa-cancel
tags:
- e2e
- Paywall
- yookassa
---
- runFlow: ../../../maestro/support/new-payment-owner.yaml
- tapOn: ^Подписка Base$
- scrollUntilVisible:
    element:
      id: paywall.plan.base_weekly
    direction: DOWN
- tapOn:
    id: paywall.plan.base_weekly
- assertVisible:
    id: paywall.plan.base_weekly
    selected: true
- takeScreenshot: Paywall-yookassa-cancel-selected
- tapOn:
    id: paywall.continue
- extendedWaitUntil:
    visible: ^Банковская карта$
    timeout: 30000
- assertVisible: ^Base - Недельный доступ$
- assertVisible: ^149[,.]00₽$
- takeScreenshot: Paywall-yookassa-cancel-sdk
- swipe:
    start: 50%,42%
    end: 50%,95%
    duration: 400
- extendedWaitUntil:
    visible: {id: paywall.continue, enabled: true}
    timeout: 30000
- assertVisible: {id: paywall.plan.base_weekly, selected: true}
- assertNotVisible: {id: scan.settings}
- takeScreenshot: Paywall-yookassa-cancel-returned
- launchApp:
    arguments:
      regressionPreview: ''
      regressionNewBillingOwner: 'false'
- extendedWaitUntil:
    visible: {id: '(scan.settings|paywall.continue)', enabled: true}
    timeout: 60000
- runFlow:
    when:
      visible: {id: scan.settings}
    commands:
    - tapOn: {id: scan.settings}
    - scrollUntilVisible:
        element: {text: '^Управление подпиской$'}
        direction: DOWN
    - tapOn: ^Управление подпиской$
    - assertVisible: ^Нет активной подписки$
    - tapOn: ^Сменить план$
- runFlow: ../../../maestro/support/paywall-ready.yaml
