appId: ${APP_ID}
name: e2e-paywall-select-base_annual
tags:
- e2e
- Paywall
---
- runFlow: ../../../maestro/support/menu.yaml
- scrollUntilVisible:
    element:
      text: ^Управление\ подпиской$
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ^Управление\ подпиской$
- scrollUntilVisible:
    element:
      text: ^Сменить\ план$
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ^Сменить\ план$
- tapOn:
    text: ^Подписка\ Base$
- assertVisible: ^Доступ\ к\ стандартным\ медицинским\ нейронным\ моделям$
- scrollUntilVisible:
    element:
      id: paywall.plan.base_annual
    direction: DOWN
    timeout: 20000
- tapOn:
    id: paywall.plan.base_annual
- assertVisible:
    id: paywall.plan.base_annual
    selected: true
- assertVisible:
    id: paywall.continue
    enabled: true
- assertVisible: ^4[\s\u00a0\u202f]*2[\s\u00a0\u202f]*9[\s\u00a0\u202f]*9,00[\s\u00a0\u202f]*₽ / год$
- assertVisible: ^Base\ \-\ Годовой\ доступ$
- takeScreenshot: Paywall-selected-base_annual
