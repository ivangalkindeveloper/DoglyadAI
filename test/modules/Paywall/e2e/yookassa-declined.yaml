appId: ${APP_ID}
name: e2e-paywall-yookassa-declined
tags:
- e2e
- Paywall
- yookassa
---
- runFlow: ../../../maestro/support/new-payment-owner.yaml
- tapOn: ^Подписка Base$
- scrollUntilVisible:
    element:
      id: paywall.plan.base_weekly
    direction: DOWN
- tapOn:
    id: paywall.plan.base_weekly
- assertVisible:
    id: paywall.plan.base_weekly
    selected: true
- takeScreenshot: Paywall-yookassa-declined-selected
- tapOn:
    id: paywall.continue
- extendedWaitUntil:
    visible: ^Банковская карта$
    timeout: 30000
- assertVisible: ^Base - Недельный доступ$
- assertVisible: ^149[,.]00₽$
- takeScreenshot: Paywall-yookassa-declined-sdk
- tapOn: ^Введите$
- inputText: '5555555555554600'
- tapOn: ^ММ/ГГ$
- inputText: '1230'
- tapOn: ^CVC$
- inputText: '123'
- tapOn: ^Продолжить$
- extendedWaitUntil:
    visible: {id: paywall.continue, enabled: true}
    timeout: 90000
- assertVisible: {id: paywall.plan.base_weekly, selected: true}
- assertNotVisible: {id: scan.settings}
- takeScreenshot: Paywall-yookassa-declined-returned
