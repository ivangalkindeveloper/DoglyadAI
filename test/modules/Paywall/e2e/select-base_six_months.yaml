appId: ${APP_ID}
name: e2e-paywall-select-base_six_months
tags:
- e2e
- Paywall
---
- runFlow: ../../../maestro/support/menu.yaml
- scrollUntilVisible:
    element:
      text: ^Управление\ подпиской$
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ^Управление\ подпиской$
- scrollUntilVisible:
    element:
      text: ^Сменить\ план$
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ^Сменить\ план$
- assertVisible: ^Смена\ подписки$
- tapOn:
    text: ^Сменить\ план$
- tapOn:
    text: ^Подписка\ Base$
- assertVisible: ^Доступ\ к\ стандартным\ медицинским\ нейронным\ моделям$
- scrollUntilVisible:
    element:
      id: paywall.plan.base_six_months
    direction: DOWN
    timeout: 20000
- tapOn:
    id: paywall.plan.base_six_months
- assertVisible:
    id: paywall.plan.base_six_months
    selected: true
- assertVisible:
    id: paywall.continue
    enabled: true
- assertVisible: ^2[\s\u00a0\u202f]*2[\s\u00a0\u202f]*4[\s\u00a0\u202f]*9,00[\s\u00a0\u202f]*₽ / 6 мес\.$
- assertVisible: ^Base\ \-\ Полугодовой\ доступ$
- takeScreenshot: Paywall-selected-base_six_months
