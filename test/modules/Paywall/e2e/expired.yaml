    text: ^Нет\ активной\ подписки$
- scrollUntilVisible:
    element:
      text: ^Сменить\ план$
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ^Сменить\ план$
- extendedWaitUntil:
    visible:
      text: ^Начните\ работать\ уже\ сегодня!$
    timeout: 60000
- runFlow: ../../../maestro/support/paywall-ready.yaml
- takeScreenshot: Paywall-expired
