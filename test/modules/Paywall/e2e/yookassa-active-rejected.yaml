appId: ${APP_ID}
name: e2e-paywall-yookassa-active-rejected
tags:
- e2e
- Paywall
- yookassa
---
- runFlow: ../../../maestro/support/menu.yaml
- scrollUntilVisible:
    element:
      text: ^Управление подпиской$
    direction: DOWN
- tapOn: ^Управление подпиской$
- assertVisible: ^Подписка Base$
- tapOn: ^Сменить план$
- tapOn: ^Подписка Pro$
- scrollUntilVisible:
    element:
      id: paywall.plan.pro_weekly
    direction: DOWN
- tapOn:
    id: paywall.plan.pro_weekly
- assertVisible:
    id: paywall.plan.pro_weekly
    selected: true
- takeScreenshot: Paywall-yookassa-active-pro-selected
- tapOn:
    id: paywall.continue
- extendedWaitUntil:
    visible: (?s)^Произошла неизвестная ошибка.*
    timeout: 30000
- assertVisible:
    id: paywall.plan.pro_weekly
    selected: true
- assertNotVisible: ^Банковская карта$
- scrollUntilVisible:
    element:
      text: (?s)^Произошла неизвестная ошибка.*
    direction: DOWN
    centerElement: true
- takeScreenshot: Paywall-yookassa-active-purchase-rejected
- tapOn: ^Back$
- assertVisible: ^Подписка Base$
- assertVisible: ^Активна$
- takeScreenshot: ManageSubscription-base-preserved-after-rejection
