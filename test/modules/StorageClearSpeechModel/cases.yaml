schemaVersion: 1
module: StorageClearSpeechModel
source: ios/Doglyad/Application/Module/Storage/StorageClearSpeechModel
cases:
- id: StorageClearSpeechModel.confirm-cancel
  title: Подтверждение удаления речевой модели
  profiles: [pro]
  preconditions:
  - В изолированном окружении подготовлены небольшие файлы структуры WhisperKit; настоящие веса не скачиваются
  steps:
  - action: Нажать удаление модели в хранилище
    expect: Показана шторка с предупреждением и кнопкой «Удалить»; файлы пока не удаляются
  - action: Закрыть шторку
    expect: Модель остаётся доступной; удаление не запускается
  - action: Открыть шторку повторно и подтвердить удаление
    expect: Шторка закрывается; callback вызывается один раз; модель удаляется обычным файловым сервисом, кнопка удаления исчезает
  covers: [onTapConfirm]
  automation:
    kind: mixed
    flows: [e2e-storage-delete-speech-model]
    nativeTests:
    - StorageConfirmationTests/speechModelDeletionRequiresConfirmationAndCancellationKeepsTheModel()
    - StorageConfirmationTests/speechModelConfirmationDismissesBeforeCallingBack()
