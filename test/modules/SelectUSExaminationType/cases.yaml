schemaVersion: 1
module: SelectUSExaminationType
source: ios/Doglyad/Application/Module/Select/SelectUSExaminationType
cases:
- id: SelectUSExaminationType.selection
  title: Группы, выбор типа и сохранение
  profiles:
  - pro
  preconditions:
  - Открыт Scan с выбранным типом
  steps:
  - action: Открыть список и выбрать тип из другой группы
    expect: Список закрыт; Scan показывает новый тип.
  - action: Перезапустить приложение
    expect: Выбор сохранён; несовместимый шаблон не применяется к другому типу.
  covers:
  - onInit
  - onTypeTap
  - onDisappear
  automation:
    kind: maestro
    flows:
    - e2e-selectusexaminationtype-choose-persist
    - e2e-selecttemplate-type-filter-failure
- id: SelectUSExaminationType.failure
  title: Необязательные недавние типы и ошибка основного выбора
  profiles:
  - pro
  preconditions:
  - Сбой чтения недавних типов или сохранения выбора
  steps:
  - action: Открыть список при сбое чтения недавних типов
    expect: Каталог доступен сразу, все кнопки доступны. Недавние скрыты; DMessager и кнопки обновления нет. Прежний выбор не теряется.
  - action: Выбрать тип при сбое записи недавних
    expect: Основной выбор сохраняется и шторка закрывается без сообщения об ошибке.
  - action: Выбрать тип при сбое обязательного onSelected
    expect: Выбор не меняется, шторка остаётся открытой, DMessager сообщает об ошибке.
  covers:
  - onInit
  - onTypeTap
  automation:
    kind: mixed
    flows:
    - e2e-selectusexaminationtype-failures
    nativeTests:
    - SelectUSExaminationTypeTests/requiredSelectionFailurePreservesValueAndReportsError()
    - SelectUSExaminationTypeTests/dismissedSelectionIgnoresLateResults(isFailure:)
