    element:
      id: examinationType.echocardiography
    direction: UP
    timeout: 20000
- tapOn:
    id: examinationType.echocardiography
- assertVisible:
    id: scan.type
    text: ^Эхокардиография$
- runFlow: ../../../maestro/support/main.yaml
- assertVisible:
    id: scan.type
    text: ^Эхокардиография$
- takeScreenshot: SelectUSExaminationType-restored
- runFlow: ../../../maestro/support/fill-scan.yaml
- assertVisible:
    id: scan.type
    text: ^Щитовидная\ железа$
