schemaVersion: 1
module: Menu
source: ios/Doglyad/Application/Module/Menu
cases:
- id: Menu.navigation
  title: Порядок пунктов и возврат
  profiles:
  - pro
  preconditions:
  - Завершён onboarding; активна Pro
  steps:
  - action: Открыть настройки и пройти пункты сверху вниз
    expect: История → шаблоны → рабочие настройки → AI → подписка → хранилище → политика → условия → о
      приложении.
  - action: Из каждого пункта вернуться в настройки
    expect: Открывается исходный экран; соседние настройки и данные не изменяются.
  - action: Нажать назад
    expect: Открывается Scan с прежним черновиком.
  covers:
  - onTapHistory
  - onTapTemplates
  - onTapWorkSettings
  - onTapSettingsAI
  - onTapSubscription
  - onTapStorage
  - onTapPrivacyPolicy
  - onTapTermsAndConditions
  - onTapAboutApp
  - onTapBack
  automation:
    kind: maestro
    flows:
    - e2e-menu-navigation
    - e2e-menu-history-summary-retry
- id: Menu.history-summary
  title: Необязательный счётчик истории
  profiles:
  - pro
  preconditions:
  - В SwiftData есть 41 отчёт и сохранён черновик. Однократный сбой чтения счётчика после проверки приложения
    при запуске.
  steps:
  - action: Открыть настройки при ошибке чтения
    expect: Все пункты доступны; карточка истории показывает общее назначение. Нет DMessager и кнопки повтора.
  - action: Открыть историю, вернуться на Scan и заново открыть настройки
    expect: Описание истории снова содержит исходное число записей; переход открывает непустую историю.
  covers:
  - onInit
  automation:
    kind: maestro
    flows:
    - e2e-menu-history-summary-retry
