appId: ${APP_ID}
name: e2e-reportreceived-failure-retry
tags: [e2e, ReportReceived, ReportDetail, History]
---
- runFlow:
    file: ../../../maestro/support/controlled-generation.yaml
    env:
      EXAMINATION_NUMBER: REG-BEFORE
- extendedWaitUntil:
    visible: {text: '^Повторить$'}
    timeout: 60000
- assertVisible: '(?s)Протокол сформирован не полностью.*'
- assertNotVisible: ^К протоколу$
- assertNotVisible: ^Копировать$
- takeScreenshot: ReportReceived-failure-retry-failed
- tapOn: ^Повторить$
- extendedWaitUntil:
    visible: {text: '^К протоколу$'}
    timeout: 180000
- assertNotVisible: ^Повторить$
- assertNotVisible: '(?s)Протокол сформирован не полностью.*'
- takeScreenshot: ReportReceived-failure-retry-completed
- tapOn: ^К протоколу$
- assertVisible: ^Протокол$
- assertVisible: ^Regression REG-BEFORE$
- assertVisible: ^REG-BEFORE$
- runFlow: ../../../maestro/support/menu.yaml
- tapOn: ^История исследований$
- tapOn: '^Regression REG-BEFORE$'
- assertVisible: ^Протокол$
- assertVisible: ^Regression REG-BEFORE$
- assertVisible: ^REG-BEFORE$
- takeScreenshot: ReportDetail-failure-retry-restored
