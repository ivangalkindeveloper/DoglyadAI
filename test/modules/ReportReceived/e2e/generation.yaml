appId: ${APP_ID}
name: e2e-reportreceived-generation
tags:
- e2e
- ReportReceived
---
- runFlow: ../../../maestro/support/fill-scan.yaml
- tapOn:
    text: ^Сгенерировать\ протокол$
- assertVisible: Согласие пациента
- assertVisible:
    id: patientConsent.doNotAsk.unselected
- takeScreenshot: PatientConsent-request
- tapOn:
    id: bottomSheet.close
- assertVisible:
    id: scan.generate
- assertNotVisible: Согласие пациента
- tapOn:
    text: ^Сгенерировать\ протокол$
- tapOn:
    id: patientConsent.doNotAsk.unselected
- assertVisible:
    id: patientConsent.doNotAsk.selected
- takeScreenshot: PatientConsent-do-not-ask
- tapOn:
    text: ^Подтвердить$
- extendedWaitUntil:
    visible:
      text: ^К\ протоколу$
    timeout: 180000
- takeScreenshot: 050-ReportReceived-ready
- tapOn:
    text: ^К\ протоколу$
- assertVisible:
    text: ^Протокол$
- assertNotVisible:
    text: '^Протокол\ сформирован\ не\ полностью\.\

      Повторите\ генерацию\ перед\ использованием\.$'
- assertNotVisible:
    text: '^Связь\ с\ сервером\ прервалась\.\

      Протокол\ получен\ не\ полностью\.$'
- takeScreenshot: 051-ReportDetail-generated
