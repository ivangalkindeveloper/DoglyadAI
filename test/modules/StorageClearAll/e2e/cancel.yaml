appId: ${APP_ID}
name: e2e-storageclearall-cancel
tags:
- e2e
- StorageClearAll
---
- runFlow: ../../../maestro/support/settings.yaml
- scrollUntilVisible:
    element:
      text: ^Хранилище$
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ^Хранилище$
- tapOn:
    text: ^Очистить\ все$
- takeScreenshot: StorageClearAll-cancel-confirmation
- tapOn: {id: bottomSheet.close}
- runFlow: ../../../maestro/support/settings.yaml
- tapOn:
    text: ^История\ исследований$
- assertVisible:
    id: 'history.loadedCount.[1-9][0-9]*'
- takeScreenshot: StorageClearAll-retained-history
