- runFlow: ../../../maestro/support/menu.yaml
- scrollUntilVisible:
    element:
      text: ^Условия\ и\ Положения$
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ^Условия\ и\ Положения$
- extendedWaitUntil:
    visible:
      text: .*Сведения о Разработчике.*
    timeout: 30000
- takeScreenshot: WebDocument-terms
- scrollUntilVisible:
    element: {text: '^19\. Контактная информация$'}
    direction: DOWN
    timeout: 180000
    speed: 100
- takeScreenshot: WebDocument-terms-end
- tapOn: {id: bottomSheet.close}
- runFlow: ../../../maestro/support/menu.yaml
- scrollUntilVisible:
    element:
      text: ^Условия\ и\ Положения$
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ^Условия\ и\ Положения$
- assertVisible:
    text: .*Сведения о Разработчике.*
