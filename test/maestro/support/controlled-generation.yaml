appId: ${APP_ID}
name: support-controlled-generation
---
- runFlow: fill-scan.yaml
- scrollUntilVisible:
    element: {id: scan.examinationNumber}
    direction: UP
    centerElement: true
- tapOn: {id: scan.examinationNumber, index: 1}
- eraseText
- inputText: ${EXAMINATION_NUMBER}
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
    element: {id: scan.patientName}
    direction: DOWN
    centerElement: true
- tapOn: {id: scan.patientName, index: 1}
- eraseText
- inputText: Regression ${EXAMINATION_NUMBER}
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
    element: {text: '^Сгенерировать протокол$'}
    direction: DOWN
- tapOn: ^Сгенерировать протокол$
