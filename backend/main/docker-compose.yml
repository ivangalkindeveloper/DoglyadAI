services:
  backend_main:
    build: .
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Configs are baked into the image (see Dockerfile), so only secrets and logs
      # come from the machine — which is what lets this file run on a VM that has
      # no copy of the repository.
      - ./secrets:/app/secrets:ro
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - secrets/.env
      - ${ENV_FILE:-secrets/.env.development}
    environment:
      # Application logs are written to ./logs with daily rotation, kept for a year.
      # They contain no patient data — only technical metadata.
      LOG_DIR: /app/logs
      LOG_RETENTION_DAYS: 365
    # Comes back by itself after a crash and after the VM reboots — otherwise the
    # backend stays down until someone notices and ssh-es in.
    restart: unless-stopped
    logging:
      # Docker's own log stays a ring buffer and does not grow without bound.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  report_worker:
    build: .
    command: [python, -m, app.report_worker]
    volumes:
      - ./secrets:/app/secrets:ro
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - secrets/.env
      - ${ENV_FILE:-secrets/.env.development}
    environment:
      LOG_DIR: /app/logs/report-worker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
