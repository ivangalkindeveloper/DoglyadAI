name: doglyad-local-database

services:
  doglyad_database:
    image: postgres:17
    environment:
      POSTGRES_DB: doglyad_database
      POSTGRES_USER: doglyad_local
      # Public credentials for this loopback-only development database.
      POSTGRES_PASSWORD: doglyad_local_only
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - doglyad_database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U doglyad_local -d doglyad_database]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  doglyad_database:
    name: doglyad-local-database-data
