# No `version:` key — Compose v2 ignores it and warns on every run.
#
# Run with `secrets/.env` as the interpolation source, not just as `env_file:` —
# Compose substitutes ${VAR} below from its own env file, never from `env_file:`:
#
#   docker compose --env-file backend/inference/secrets/.env -f backend/inference/docker-compose.yml up -d --build
#
# `make start-backend-inference` does exactly that.

services:
  # The model engine. Bound to the internal Docker network only — it has no
  # authentication of its own and must never be reachable from outside the VM.
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.27.1@sha256:c2f3b1b964e47809b722b5e75b61b1e7b39a50f70388cf2bf2418f16a9f31da2}
    command: >
      ${SERVED_MODEL_ID}
      --served-model-name ${SERVED_MODEL_ID}
      --host 0.0.0.0
      --port 8000
      --max-model-len ${VLLM_MAX_MODEL_LEN:-16384}
      --limit-mm-per-prompt '{"image":${VLLM_LIMIT_MM_PER_PROMPT:-10}}'
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-16}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      --enable-prefix-caching
    environment:
      HF_TOKEN: ${HF_TOKEN}
      # Older vLLM builds read the token under its previous name.
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
    volumes:
      # Weights survive restarts, so only the first boot pays the download.
      - huggingface:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # Model load takes minutes; start_period keeps the container from being
      # marked unhealthy while the weights are still being read.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 900s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  backend_inference:
    build: .
    # Bind to the private interface: the backend VM reaches this port, the
    # internet should not. Set INFERENCE_BACKEND_BIND to the VM's private address.
    ports:
      - "${INFERENCE_BACKEND_BIND:-0.0.0.0}:${INFERENCE_BACKEND_PORT:-8100}:8000"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./logs:/app/logs
    env_file:
      - secrets/.env
    environment:
      VLLM_BASE_URL: http://vllm:8000
      # Application logs are written to ./logs with daily rotation, kept for a year.
      # They contain no request payloads — only technical metadata.
      LOG_DIR: /app/logs
      LOG_RETENTION_DAYS: 365
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped
    logging:
      # Docker's own log stays a ring buffer and does not grow without bound.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  huggingface:
