# Main application processes and public ingress. Used together with the required
# docker-compose.database.yml overlay through main-compose.sh on both main VMs.
# The machine .env selects TAG, ENV_FILE, DOMAIN and the pinned DATABASE_IMAGE.
x-main-app: &main-app
  image: ghcr.io/ivangalkindeveloper/doglyad-main:${TAG:-latest}
  volumes:
    - ./secrets:/app/secrets:ro
    - ./logs:/app/logs
  env_file:
    - secrets/.env
    - ${ENV_FILE:?ENV_FILE is required}
  environment: &main-environment
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    LOG_DIR: /app/logs
  depends_on:
    database_migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  backend_main:
    <<: *main-app
    # Only Caddy reaches the API. No host API port is published.
    expose: ["8000"]
    environment:
      <<: *main-environment
      LOG_RETENTION_DAYS: 365

  report_worker:
    <<: *main-app
    command: [python, -m, app.report_worker]
    environment:
      <<: *main-environment
      LOG_DIR: /app/logs/report-worker

  billing_gateway:
    <<: *main-app
    command: [uvicorn, app.payment_main:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "*", --no-access-log]
    environment:
      <<: *main-environment
      LOG_DIR: /app/logs/billing-gateway
    expose: ["8000"]

  billing_worker:
    <<: *main-app
    command: [python, -m, app.billing_worker]
    environment:
      <<: *main-environment
      LOG_DIR: /app/logs/billing-worker

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend_main
      - billing_gateway
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
