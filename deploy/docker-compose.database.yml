# Shared application database and schema migrations. Combined with the main stack.
services:
  doglyad_database:
    image: ${DATABASE_IMAGE:?Run main setup to pin the database image}
    environment:
      POSTGRES_DB: doglyad_database
      POSTGRES_USER: doglyad
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    volumes:
      - doglyad_database:/var/lib/postgresql/data
      - ./database-secrets/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./database-backups/repository:/var/lib/pgbackrest/repository
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=doglyad_database archive-push %p
      - -c
      - archive_timeout=60s
    healthcheck:
      test: [CMD-SHELL, pg_isready -U doglyad -d doglyad_database]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  database_migrate:
    image: ghcr.io/ivangalkindeveloper/doglyad-main:${TAG:-latest}
    command: [alembic, upgrade, head]
    restart: "no"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./logs:/app/logs
    env_file:
      - secrets/.env
      - ${ENV_FILE:?ENV_FILE is required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LOG_DIR: /app/logs
    depends_on:
      doglyad_database:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  doglyad_database:
