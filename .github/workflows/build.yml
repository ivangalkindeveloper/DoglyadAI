name: Build backend images
run-name: Backend images ${{ inputs.deployment_id || github.sha }}

# Check both services before publishing either image to GitHub Container Registry.
# VMs contain neither source code nor build tooling; they use docker compose pull.
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/build.yml'
      - 'Makefile'
      - 'tools/format_python.py'
      - 'tools/python_argument_transformer.py'
      - 'tools/tests/test_format_python.py'
      - 'tools/local_billing_database.py'
      - 'tools/tests/test_local_billing_database.py'
      - '.vscode/launch.json'
      - '.vscode/tasks.json'
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/build.yml'
      - 'Makefile'
      - 'tools/format_python.py'
      - 'tools/python_argument_transformer.py'
      - 'tools/tests/test_format_python.py'
      - 'tools/local_billing_database.py'
      - 'tools/tests/test_local_billing_database.py'
      - '.vscode/launch.json'
      - '.vscode/tasks.json'
  # Publishing stays explicit; pushes and pull requests run checks only.
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Optional deployment correlation ID
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [main, inference]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/${{ matrix.service }}/requirements.txt
            backend/${{ matrix.service }}/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python ../../tools/format_python.py --check .
      - name: Check Python development tools
        if: matrix.service == 'main'
        working-directory: .
        run: |
          python -m unittest discover -s tools/tests -p 'test_format_python.py'
          python -m unittest discover -s tools/tests -p 'test_local_billing_database.py'
      - run: python -m mypy
      - run: python -m pytest
      - name: Check deployment tools
        if: matrix.service == 'main'
        run: |
          python -m unittest discover -s ../../deploy/test -p 'test_*.py'
          python -m ruff check --config ../../deploy/ruff.toml ../../deploy/inference ../../deploy/test ../../deploy/update_infrastructure.py ../../deploy/update_remote.py
          for script in ../../deploy/bootstrap.sh ../../deploy/sync-secrets.sh ../../deploy/start-backend.sh ../../deploy/update-infrastructure.sh ../../deploy/inference/start.sh ../../deploy/dgx-spark/prepare-host.sh; do
            bash -n "$script"
          done

  check_billing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: doglyad-ci-test-only
          POSTGRES_DB: doglyad_test_billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doglyad_test_billing"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ENVIRONMENT: development
      BILLING_DATABASE_URL: postgresql+asyncpg://postgres:doglyad-ci-test-only@localhost:5432/doglyad_test_billing
      DOGLYAD_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:doglyad-ci-test-only@localhost:5432/doglyad_test_billing
    defaults:
      run:
        working-directory: backend/main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/main/requirements.txt
            backend/main/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check migrations
      - run: python ../../tools/format_python.py --check migrations
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: >-
          python -m pytest tests/test_billing.py tests/test_checkout_payments.py
          tests/test_billing_catalog.py tests/test_billing_worker.py
          tests/test_robokassa_payment_provider.py tests/test_robokassa_refunds.py
          tests/test_billing_migrations.py tests/test_billing_postgres.py
          tests/test_billing_reconciliation.py

  build:
    needs: [check, check_billing]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      # Verify native images before publishing a multi-platform manifest.
      matrix:
        include:
          - service: main
            architecture: amd64
            runner: ubuntu-latest
          - service: inference
            architecture: amd64
            runner: ubuntu-latest
          - service: inference
            architecture: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build a local image for runtime checks
        uses: docker/build-push-action@v6
        with:
          context: backend/${{ matrix.service }}
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: doglyad-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.architecture }}

      - name: Verify non-root startup with synthetic credentials
        run: python3 deploy/verify_backend_image.py doglyad-${{ matrix.service }}:ci ${{ matrix.service }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GitHub Actions provides this automatically; no custom token is required.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified image
        env:
          BACKEND_LOCAL_IMAGE: doglyad-${{ matrix.service }}:ci
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/doglyad-${{ matrix.service }}
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          docker tag "$BACKEND_LOCAL_IMAGE" "$BACKEND_IMAGE:$GITHUB_SHA-$IMAGE_ARCHITECTURE"
          docker push "$BACKEND_IMAGE:$GITHUB_SHA-$IMAGE_ARCHITECTURE"

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [main, inference]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified platform manifests
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/doglyad-${{ matrix.service }}
          BACKEND_SERVICE: ${{ matrix.service }}
        run: |
          images=("$BACKEND_IMAGE:$GITHUB_SHA-amd64")
          if [ "$BACKEND_SERVICE" = inference ]; then
            images+=("$BACKEND_IMAGE:$GITHUB_SHA-arm64")
          fi
          docker buildx imagetools create \
            --tag "$BACKEND_IMAGE:$GITHUB_SHA" \
            --tag "$BACKEND_IMAGE:latest" "${images[@]}"
