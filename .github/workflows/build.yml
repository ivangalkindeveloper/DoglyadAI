name: Build backend images
run-name: Backend images ${{ inputs.deployment_id || github.sha }}

# Check both services before publishing either image to GitHub Container Registry.
# VMs contain neither source code nor build tooling; they use docker compose pull.
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/build.yml'
      - 'Makefile'
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/build.yml'
      - 'Makefile'
  # Publishing stays explicit; pushes and pull requests run checks only.
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Optional deployment correlation ID
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [main, inference]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/${{ matrix.service }}/requirements.txt
            backend/${{ matrix.service }}/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m ruff format --check app tests
      - run: python -m mypy
      - run: python -m pytest
      - name: Check deployment tools
        if: matrix.service == 'main'
        run: |
          python -m unittest discover -s ../../deploy/test -p 'test_*.py'
          for script in ../../deploy/bootstrap.sh ../../deploy/sync-secrets.sh ../../deploy/start-backend.sh ../../deploy/update-infrastructure.sh; do
            bash -n "$script"
          done

  build:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Build two independent images in parallel.
      matrix:
        service: [main, inference]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build a local image for runtime checks
        uses: docker/build-push-action@v6
        with:
          context: backend/${{ matrix.service }}
          platforms: linux/amd64
          load: true
          tags: doglyad-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root startup with synthetic credentials
        run: python3 deploy/verify_backend_image.py doglyad-${{ matrix.service }}:ci ${{ matrix.service }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GitHub Actions provides this automatically; no custom token is required.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified image
        env:
          BACKEND_LOCAL_IMAGE: doglyad-${{ matrix.service }}:ci
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/doglyad-${{ matrix.service }}
        run: |
          docker tag "$BACKEND_LOCAL_IMAGE" "$BACKEND_IMAGE:$GITHUB_SHA"
          docker tag "$BACKEND_LOCAL_IMAGE" "$BACKEND_IMAGE:latest"
          docker push "$BACKEND_IMAGE:$GITHUB_SHA"
          docker push "$BACKEND_IMAGE:latest"
