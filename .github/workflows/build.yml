name: Build backend images
run-name: Backend images ${{ inputs.deployment_id || github.sha }}

# Build both backend images and publish them to GitHub Container Registry.
# VMs contain neither source code nor build tooling; they use docker compose pull.
on:
  # Manual only for now through the "Run workflow" button in Actions. Enable
  # builds on pushes to master after the deployment process is proven stable.
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Optional deployment correlation ID
        required: false
        type: string

permissions:
  contents: read
  # Required to prevent docker push to ghcr.io from returning 403.
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Build two independent images in parallel.
      matrix:
        service: [main, inference]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GitHub Actions provides this automatically; no custom token is required.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Read Dockerfile and .dockerignore from this directory.
          context: backend/${{ matrix.service }}
          # VMs use amd64 while a developer machine may use arm64. Pin the platform
          # so the resulting image does not depend on the build machine.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/doglyad-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/doglyad-${{ matrix.service }}:latest
          # Reuse layers between runs so pip install is skipped while
          # requirements.txt remains unchanged.
          cache-from: type=gha
          cache-to: type=gha,mode=max
