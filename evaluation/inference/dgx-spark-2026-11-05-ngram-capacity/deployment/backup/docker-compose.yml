        "--enable-prefix-caching",
        "--no-enable-log-requests",
        "--no-enable-log-outputs",
        "--structured-outputs-config",
        "{\"backend\":\"xgrammar\",\"disable_any_whitespace\":true}"
      ],
      "env_file": [
        "secrets/.env"
      ],
      "volumes": [
        "huggingface:/root/.cache/huggingface"
      ],
      "shm_size": "4gb",
      "deploy": {
        "resources": {
          "reservations": {
            "devices": [
              {
                "driver": "nvidia",
                "device_ids": [
                  "0"
                ],
                "capabilities": [
                  "gpu"
                ]
              }
            ]
          }
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
